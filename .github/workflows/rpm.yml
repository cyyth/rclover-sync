name: RPM

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

# One RPM for every supported Fedora. It is built on the oldest one (44): its binary needs
# only stable library versions (glibc, GTK 4, ...), which newer Fedoras keep providing.
# The install job proves that on the newest one. There is no dist tag (.fc44) in the name,
# so the file does not look tied to one release.
jobs:
  rpm:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build dependencies
        run: dnf install -y git rpm-build make cargo rust gtk4-devel libadwaita-devel

      - uses: actions/checkout@v4

      - name: Build RPM
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=$(rpmspec -q --srpm --qf '%{version}' rclover-sync.spec)
          name=$(rpmspec -q --srpm --qf '%{name}' rclover-sync.spec)
          mkdir -p ~/rpmbuild/SOURCES dist
          git archive --format=tar.gz --prefix=rclover-sync-$version/ -o ~/rpmbuild/SOURCES/$name-$version.tar.gz HEAD
          rpmbuild -ba --define 'dist %{nil}' rclover-sync.spec
          cp ~/rpmbuild/RPMS/*/*.rpm ~/rpmbuild/SRPMS/*.rpm dist/

      - uses: actions/upload-artifact@v4
        with:
          name: rpms
          path: dist/*.rpm

  install:
    needs: rpm
    strategy:
      matrix:
        fedora: ['44', '45']
    runs-on: ubuntu-latest
    container: fedora:${{ matrix.fedora }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rpms
          path: dist

      - name: Install on Fedora ${{ matrix.fedora }}
        run: dnf install -y $(ls dist/*.rpm | grep -v '\.src\.rpm$')

  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y make cargo libgtk-4-dev libadwaita-1-dev

      - name: Build .deb
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          make build
          make install DESTDIR=pkg PREFIX=/usr 
          mkdir pkg/DEBIAN dist
          cat > pkg/DEBIAN/control <<EOF2
          Package: rclover
          Version: $version
          Architecture: amd64
          Maintainer: Thanapong Chuangyanyong
          Depends: rclone, fuse3, libgtk-4-1, libadwaita-1-0
          Description: GNOME cloud-drive manager with on-demand rclone mounts
          EOF2
          sed -i 's/^ *//' pkg/DEBIAN/control
          dpkg-deb --root-owner-group --build pkg dist/rclover_${version}_amd64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: debs
          path: dist/*.deb

  release:
    needs: [install, deb]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rpms
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: debs
          path: dist

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.rpm
            dist/*.deb
