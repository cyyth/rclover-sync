[package]
name = "rclover-sync"
version = "0.3.3"
edition = "2021"
rust-version = "1.84"
license = "GPL-3.0-or-later"
description = "GNOME cloud-drive manager: on-demand rclone mounts with selective offline folders"
repository = "https://github.com/cyyth/rclover-sync"
resolver = "3"

[[bin]]
name = "rclover"
path = "src/main.rs"

[dependencies]
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
async-channel = "2"
base64 = "0.22"
ksni = { version = "=0.3.6", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", default-features = false, features = ["json"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
